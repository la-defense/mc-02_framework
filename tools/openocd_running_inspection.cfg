# Start OpenOCD for background-memory inspection of a running MC-02.
# Do not add reset, halt, resume, or target-writing commands to this file.
source [find interface/cmsis-dap.cfg]
transport select swd

set CHIPNAME mc02
source [find target/stm32h7x.cfg]

# OpenOCD defaults GDB attach to halt the core. Empty both callbacks so an
# inspector attach/disconnect cannot stop or restart the target.
mc02.cpu0 configure -event gdb-attach {}
mc02.cpu0 configure -event gdb-detach {}

# Avoid flash-map probing while the target is running.
gdb memory_map disable
gdb_port 3333
init
