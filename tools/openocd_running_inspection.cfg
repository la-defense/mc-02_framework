# Start a local-only OpenOCD server for bounded reads from a running MC-02.
# The GDB and Tcl servers are disabled; do not add target-control or write commands.
bindto 127.0.0.1
source [find interface/cmsis-dap.cfg]
transport select swd

set CHIPNAME mc02
source [find target/stm32h7x.cfg]

# The target script sets 1800 kHz; apply the tested conservative rate after it.
adapter speed 400

# The STM32H7 target script installs an examine-end callback that writes DBGMCU
# freeze registers. Remove it so inspection setup does not alter target state.
mc02.cpu0 configure -event examine-end {}

telnet port 4444
gdb port disabled
tcl port disabled
init
