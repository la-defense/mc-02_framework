<p class="kicker">速查 · 安全控制</p><h1>瞄准控制有效性</h1>
<p>输出模式 1 的必要条件：MC-02 在线且处于允许联调的空闲模式、目标存在、状态未超龄、角度有限且在已配置边界内。裸板测试始终禁火。</p>
<p>上述任一条件失败：构造模式 0 中立帧并禁火。链路不可发送时，由 MC-02 本地视觉超时清空旧接收命令并失能。</p>
<p>机械边界必须来自目标设备配置或测量，课程中的数值只用于模拟。</p>
