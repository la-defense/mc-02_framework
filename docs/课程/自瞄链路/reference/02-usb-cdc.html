<p class="kicker">速查 · USB CDC</p><h1>发送状态</h1>
<pre><code>未配置 → 拒绝
空闲且缓冲有效 → 复制到持久缓冲并提交
BUSY → 保留现有帧，不覆盖正在发送的数据
传输完成回调 → 释放缓冲供下一帧使用</code></pre>
<ul><li>计数区分提交成功与忙时丢弃。</li><li>函数返回不表示端点传输完成。</li><li>异步 DMA/USB 使用栈局部缓冲属于生命周期错误。</li><li>接收侧按 USB 库约定重新武装 OUT 端点。</li></ul>
