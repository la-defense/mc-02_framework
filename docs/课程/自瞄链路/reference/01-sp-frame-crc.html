<p class="kicker">速查 · 协议</p><h1>SP 帧与 CRC</h1>
<ul><li>MC-02 → vision：43 字节状态帧。</li><li>Vision → MC-02：29 字节控制帧。</li><li>帧头：字节 <code>'S'</code>、<code>'P'</code>。</li><li>控制模式：0 中立，1 控制不开火，2 控制并允许开火；裸板练习只发 0 或 1。</li><li>CRC 帧尾按低字节优先写入；验证算法、覆盖范围、初值和输出约定。</li></ul>
<p>合法数据条件：精确长度 + 帧头正确 + CRC 匹配。CRC 检测意外损坏，不认证发送方。</p>
