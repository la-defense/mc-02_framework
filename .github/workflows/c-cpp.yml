name: MC-02 firmware and host CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install WSL-equivalent host and ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Check firmware TODO contract
        run: python3 tools/workflow/check_todo.py .Doc/TODO.md

      - name: Test bounded live probe snapshot tool
        run: python3 -m unittest discover -s tests/tools -p 'test_*.py'

      - name: Build and run host safety tests from CMake presets
        working-directory: tests/host
        run: |
          for preset in host-debug host-release; do
            cmake --preset "$preset"
            cmake --build --preset "$preset" --parallel 2
            ctest --preset "$preset"
          done

      - name: Check incremental explicit source manifests
        run: python3 tools/workflow/check_cmake_regeneration.py --work-dir build/cmake-regeneration --generator Ninja --build-type Debug --jobs 2

      - name: Validate and run learning exercises
        run: python3 tools/workflow/check_exercises.py --build --generator Ninja

      - name: Check GCC format diagnostics
        run: python3 tools/workflow/check_format_diagnostics.py --compiler arm-none-eabi-gcc --output build/format-probes

      - name: Build the ten supported profile and role combinations
        run: |
          for preset in bench-debug bench-rel rcdiag-debug rcdiag-rel \
                        robot-single-debug robot-single-rel \
                        robot-chassis-debug robot-chassis-rel \
                        robot-gimbal-debug robot-gimbal-rel; do
            cmake --preset "$preset"
            cmake --build --preset "$preset" --parallel 2
          done

      - name: Check profile isolation and actual source selection
        run: |
          for level in debug rel; do
            python3 tools/workflow/check_firmware_profile.py --profile bench_safe --role single --build-dir "build/wsl/bench-${level}" "build/wsl/bench-${level}/Basic_Framework_MC02_bench_safe.elf"
            python3 tools/workflow/check_firmware_profile.py --profile bench_safe --role single --rc-diagnostics --build-dir "build/wsl/rcdiag-${level}" "build/wsl/rcdiag-${level}/Basic_Framework_MC02_rcdiag_bench_safe.elf"
          done
          for role in single chassis gimbal; do
            for level in debug rel; do
              artifact="Basic_Framework_MC02_robot.elf"
              if [ "$role" = chassis ]; then artifact="Basic_Framework_MC02_chassis_robot.elf"; fi
              if [ "$role" = gimbal ]; then artifact="Basic_Framework_MC02_gimbal_robot.elf"; fi
              python3 tools/workflow/check_firmware_profile.py --profile robot --role "$role" --build-dir "build/wsl/robot-${role}-${level}" "build/wsl/robot-${role}-${level}/$artifact"
            done
          done

      - name: Reject unsafe and conflicting configurations
        shell: bash
        run: |
          reject_config() {
            name="$1"
            shift
            if cmake -S . -B "build/wsl/invalid-${name}" -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-toolchain.cmake "$@"; then
              echo "Invalid configuration unexpectedly accepted: ${name}"
              exit 1
            fi
          }
          reject_config heater -DMC02_PROFILE=bench_safe -DMC02_ENABLE_HEATER=ON
          reject_config role -DMC02_PROFILE=robot -DMC02_BOARD_ROLE=unknown
          reject_config bench-dual -DMC02_PROFILE=bench_safe -DMC02_BOARD_ROLE=chassis
          reject_config gimbal-ui -DMC02_PROFILE=robot -DMC02_BOARD_ROLE=gimbal -DMC02_ENABLE_REFEREE_UI=ON
          reject_config role-macro -DMC02_PROFILE=robot -DMC02_BOARD_ROLE=single '-DCMAKE_C_FLAGS=-DGIMBAL_BOARD'
          reject_config vision-macro -DMC02_PROFILE=robot -DMC02_BOARD_ROLE=single '-DCMAKE_C_FLAGS=-DVISION_USE_UART'

      - name: Build optional local-only configurations
        run: |
          configure_build() {
            directory="$1"
            shift
            cmake -S . -B "build/wsl/${directory}" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-toolchain.cmake \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug "$@"
            cmake --build "build/wsl/${directory}" --parallel 2
          }
          configure_build robot-single-ui-off -DMC02_PROFILE=robot -DMC02_BOARD_ROLE=single -DMC02_VISION_TRANSPORT=usb -DMC02_ENABLE_REFEREE_UI=OFF
          configure_build robot-chassis-ui-off -DMC02_PROFILE=robot -DMC02_BOARD_ROLE=chassis -DMC02_VISION_TRANSPORT=usb -DMC02_ENABLE_REFEREE_UI=OFF
          configure_build robot-single-uart -DMC02_PROFILE=robot -DMC02_BOARD_ROLE=single -DMC02_VISION_TRANSPORT=uart -DMC02_ENABLE_REFEREE_UI=ON
          configure_build rcdiag-log-test -DMC02_PROFILE=bench_safe -DMC02_BOARD_ROLE=single -DMC02_VISION_TRANSPORT=usb -DMC02_BENCH_RC_DIAGNOSTICS=ON -DMC02_LOG_ORDINARY=ON -DMC02_LOG_TEST=ON -DMC02_ENABLE_REFEREE_UI=OFF
          configure_build refdiag -DMC02_PROFILE=bench_safe -DMC02_BOARD_ROLE=single -DMC02_VISION_TRANSPORT=usb -DMC02_BENCH_REFEREE_DIAGNOSTICS=ON -DMC02_ENABLE_REFEREE_UI=OFF
          ! grep -q 'modules/referee/referee_UI.c' build/wsl/robot-single-ui-off/mc02-selected-sources.txt
          ! grep -q 'modules/referee/referee_UI.c' build/wsl/robot-chassis-ui-off/mc02-selected-sources.txt
          ! grep -q 'VISION_USE_VCP' build/wsl/robot-single-uart/compile_commands.json
          grep -q 'VISION_USE_UART' build/wsl/robot-single-uart/compile_commands.json
          python3 tools/workflow/check_firmware_profile.py --profile robot --role single --ui-disabled --build-dir build/wsl/robot-single-ui-off build/wsl/robot-single-ui-off/Basic_Framework_MC02_robot.elf
          python3 tools/workflow/check_firmware_profile.py --profile robot --role chassis --ui-disabled --build-dir build/wsl/robot-chassis-ui-off build/wsl/robot-chassis-ui-off/Basic_Framework_MC02_chassis_robot.elf
          python3 tools/workflow/check_firmware_profile.py --profile robot --role single --vision-transport uart --build-dir build/wsl/robot-single-uart build/wsl/robot-single-uart/Basic_Framework_MC02_robot.elf
